# Existing TLS PostgreSQL. Linux host networking keeps upstream HTTP loopback-only.
services:
  team:
    image: ${TERMTERM_SERVICE_IMAGE:-termterm/team-service:0.4.1}
    pull_policy: never
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    network_mode: host
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    cpus: ${TERMTERM_TEAM_CPUS:-1.0}
    mem_limit: ${TERMTERM_TEAM_MEMORY:-512m}
    memswap_limit: ${TERMTERM_TEAM_MEMORY:-512m}
    pids_limit: 128
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, "3", "${TERMTERM_HEALTH_URL:-http://127.0.0.1:41841/health}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ${TERMTERM_CONFIG_DIR:?Set private config directory}:/etc/termterm-team:ro
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
  https:
    image: caddy:2.10.2@sha256:c3d7ee5d2b11f9dc54f947f68a734c84e9c9666c92c88a7f30b9cba5da182adb
    network_mode: host
    environment:
      TERMTERM_DOMAIN: ${TERMTERM_DOMAIN:?Set the HTTPS DNS name}
    volumes:
      - ${TERMTERM_CADDY_FILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    cpus: ${TERMTERM_HTTPS_CPUS:-0.5}
    mem_limit: ${TERMTERM_HTTPS_MEMORY:-128m}
    memswap_limit: ${TERMTERM_HTTPS_MEMORY:-128m}
    pids_limit: 128
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  caddy_data:
  caddy_config:
